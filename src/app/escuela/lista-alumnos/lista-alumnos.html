<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Lista Alumnos
  </h1>

  <form [formGroup]="formulario" (ngSubmit)="muestraAlumnos()">

    <div class="mb-5">
      <label for="matricula" class="block mb-2 text-sm font-medium text-gray-900">
        Matrícula
      </label>
      <input 
        type="text" 
        id="matricula" 
        formControlName="matricula"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-full block w-full p-2.5 px-4 focus:ring-blue-500 focus:border-blue-500" 
        placeholder="Matricula"
      >
    </div>

    <div class="mb-5">
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">
        Nombre
      </label>
      <input 
        type="text" 
        id="nombre" 
        formControlName="nombre"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-full block w-full p-2.5 px-4 focus:ring-blue-500 focus:border-blue-500" 
        placeholder="Nombre Completo"
      >
    </div>

    <div class="mb-5">
      <label for="correo" class="block mb-2 text-sm font-medium text-gray-900">
        Correo
      </label>
      <input 
        type="email" 
        id="correo" 
        formControlName="correo"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-full block w-full p-2.5 px-4 focus:ring-blue-500 focus:border-blue-500" 
        placeholder="Correo Electronico"
      >
    </div>

    <div class="mb-5">
      <label for="materia" class="block mb-2 text-sm font-medium text-gray-900">
        Materia
      </label>
      <input 
        type="text" 
        id="materia" 
        formControlName="materia"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-full block w-full p-2.5 px-4 focus:ring-blue-500 focus:border-blue-500" 
        placeholder="Materia"
      >
    </div>

    <div class="flex justify-center mt-6 gap-3">
      <button 
        type="submit" 
        class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm px-8 py-2.5 text-center"
      >
        Registrar
      </button>

      <button
        type="button"
        (click)="cargarAlumnos()"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-full text-sm px-8 py-2.5 text-center"
      >
        Cargar
      </button>
    </div>

  </form>

<div class="max-w-6xl mx-auto mt-8">
  <h2 class="mb-4 text-2xl font-bold text-gray-900">
    Lista de alumnos
  </h2>
  
  <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
    <table class="w-full text-sm text-left text-gray-500">
      
      <thead class="text-xs text-gray-700 uppercase bg-gray-100">
        <tr>
          <th scope="col" class="px-6 py-3">
            Matrícula
          </th>
          <th scope="col" class="px-6 py-3">
            Nombre
          </th>
          <th scope="col" class="px-6 py-3">
            Correo
          </th>
          <th scope="col" class="px-6 py-3">
            Materia
          </th>
          <th scope="col" class="px-6 py-3">
            Acciones
          </th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let alumno1 of alumnos; let i = index" class="bg-white border-b border-gray-200 hover:bg-gray-50">
          <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">
            {{ alumno1.matricula }}
          </td>
          <td class="px-6 py-4">
            {{ alumno1.nombre }}
          </td>
          <td class="px-6 py-4">
            {{ alumno1.correo }}
          </td>
          <td class="px-6 py-4">
            {{ alumno1.materia }}
          </td>
          <td class="px-6 py-4">
            <div class="flex gap-2">
              <button
                type="button"
                class="px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 focus:ring-4 focus:outline-none focus:ring-green-300"
                (click)="editarAlumnos(i)"
              >
                Editar
              </button>

              <button
                type="button"
                class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-4 focus:outline-none focus:ring-red-300"
                (click)="eliminarAlumno(i)"
              >
                Eliminar
              </button>
            </div>
          </td>
        </tr>
      </tbody>

    </table>
  </div>

   <div *ngIf="alumnos.length === 0" class="p-4 mt-4 text-sm text-gray-800 rounded-lg bg-gray-100" role="alert">
    <span class="font-medium">Información:</span> No hay alumnos registrados.
  </div>

</div>
</div>
