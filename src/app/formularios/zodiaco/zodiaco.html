<body>
  <br>
  <br>
  <br>
<div class="max-w-5xl mx-auto my-8 p-6 bg-white border border-gray-200 rounded-lg shadow">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch">
    
    <div class="pr-0 md:pr-6 border-b md:border-b-0 md:border-r border-gray-300 pb-6 md:pb-0">
      <h3 class="text-2xl font-bold text-center text-gray-900 mb-6">
        Datos Personales Zodiaco
      </h3>

      <form [formGroup]="formulario" (ngSubmit)="imprimir()">
        
        <div class="mb-4 flex items-center gap-3">
          <label for="nombre" class="w-28 text-sm font-medium text-gray-900">
            |Nombre:
          </label>
          <input 
            type="text" 
            id="nombre" 
            formControlName="nombre" 
            placeholder="Nombre"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          >
        </div>

        <div class="mb-4 flex items-center gap-3">
          <label for="apaterno" class="w-28 text-sm font-medium text-gray-900">
            |Apellido Paterno:
          </label>
          <input 
            type="text" 
            id="apaterno" 
            formControlName="apaterno" 
            placeholder="Apaterno"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          >
        </div>

        <div class="mb-4 flex items-center gap-3">
          <label for="amaterno" class="w-28 text-sm font-medium text-gray-900">
           |Apellido Materno: 
          </label>
          <input 
            type="text" 
            id="amaterno" 
            formControlName="amaterno" 
            placeholder="Amaterno"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          >
        </div>

        <div class="mb-4 mt-6">
          <label class="block text-sm font-medium text-center text-gray-900 mb-2">
            |Fecha de nacimiento:
          </label>
          <div class="grid grid-cols-3 gap-3 text-center">
            <div>
              <label for="dia" class="block mb-1 text-xs text-gray-700">Día:</label>
              <input 
                type="number" 
                id="dia" 
                formControlName="dia" 
                placeholder="01" 
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 text-center"
              >
            </div>
            <div>
              <label for="mes" class="block mb-1 text-xs text-gray-700">Mes:</label>
              <input 
                type="number" 
                id="mes" 
                formControlName="mes" 
                placeholder="01" 
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 text-center"
              >
            </div>
            <div>
              <label for="anio" class="block mb-1 text-xs text-gray-700">Año:</label>
              <input 
                type="number" 
                id="anio" 
                formControlName="anio" 
                placeholder="2000" 
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 text-center"
              >
            </div>
          </div>
        </div>

        <div class="mb-6">
          <label class="block mb-2 text-sm font-medium text-gray-900">
            Sexo
          </label>
          <div class="space-y-2 pl-2">
            <div class="flex items-center">
              <input 
                id="sexo-masculino" 
                type="radio" 
                value="Masculino" 
                formControlName="sexo" 
                class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500"
              >
              <label for="sexo-masculino" class="ms-2 text-sm font-medium text-gray-900">
                Masculino
              </label>
            </div>
            <div class="flex items-center">
              <input 
                id="sexo-femenino" 
                type="radio" 
                value="Femenino" 
                formControlName="sexo" 
                class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500"
              >
              <label for="sexo-femenino" class="ms-2 text-sm font-medium text-gray-900">
                Femenino
              </label>
            </div>
          </div>
        </div>

        <div class="mt-6">
          <button 
            type="submit" 
            class="w-full text-gray-900 bg-white border-2 border-gray-900 hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-300 font-bold rounded-lg text-sm px-5 py-2.5 text-center"
          >
            imprimir
          </button>
        </div>
      </form>
    </div>

    <div class="flex flex-col items-center justify-center p-4 text-center">
      <ng-container *ngIf="persona.signo; else vacio">
        <h2 class="text-2xl font-normal text-gray-900 mb-4">
          ¡Hola <span class="font-bold italic">{{ persona.nombre }} {{ persona.apaterno }} {{ persona.amaterno }}</span>
        </h2>

        <p class="text-xl text-gray-900 mb-4">
          Tienes <span class="font-bold">{{ persona.edad }}</span> años
        </p>

        <p class="text-xl text-gray-900 mb-4">
          tu signo zodiacal
        </p>

        <div class="flex items-center justify-center gap-3 mt-2">
          <span class="text-2xl text-gray-900">
            Es <span class="font-semibold capitalize">{{ persona.signo }}</span>
          </span>
          <div class="w-20 h- flex items-center justify-center p-2 shadow-md">
            <img 
              [src]="persona.imagen" 
              [alt]="persona.signo" 
              class="w-full h-full object-contain"
            >
          </div>
        </div>
      </ng-container>

      <ng-template #vacio>
        <p class="text-gray-400 italic">
          Completa los datos
        </p>
      </ng-template>
    </div>

  </div>
</div>
</body>
